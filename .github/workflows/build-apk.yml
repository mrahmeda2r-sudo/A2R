name: Build Legacy APK

on:
  push:
    branches: [legacy]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/legacy'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Generate android platform
        run: flutter create --platforms=android --project-name a2r --org com.a2r .

      - name: Install locked legacy dependencies
        run: |
          cp legacy/pubspec.yaml pubspec.yaml
          cp legacy/pubspec.lock pubspec.lock
          flutter pub get --enforce-lockfile
          flutter pub deps --style=compact

      - name: Build app data from data.xlsx
        run: |
          python3 -m pip install --break-system-packages openpyxl
          mkdir -p assets
          python3 - <<'PY'
          import json, re, sys
          from openpyxl import load_workbook

          wb = load_workbook('data.xlsx', data_only=True)
          if len(wb.worksheets) < 2:
              sys.exit('data.xlsx لازم يكون فيه ورقتين: الأسماء ثم الوحدات')

          def txt(v):
              if v is None:
                  return ''
              if isinstance(v, float) and v.is_integer():
                  v = int(v)
              return str(v).strip()

          names = []
          for (v,) in wb.worksheets[0].iter_rows(min_row=2, max_col=1, values_only=True):
              if txt(v):
                  names.append(txt(v))

          units = []
          for i, row in enumerate(wb.worksheets[1].iter_rows(min_row=2, max_col=4, values_only=True), start=2):
              num, name, tid, bld = (txt(c) for c in row)
              if not (num or name or tid or bld):
                  continue
              if not (num and name and tid):
                  sys.exit(f'ورقة الوحدات صف {i}: الرقم أو الاسم أو TID فاضي')
              try:
                  n = int(float(num))
              except ValueError:
                  sys.exit(f'ورقة الوحدات صف {i}: الرقم "{num}" مش رقم')
              blds = [b.strip() for b in re.split(r'[،,;|\n]', bld) if b.strip()]
              units.append({'num': n, 'name': name, 'tid': tid, 'buildings': blds})

          if not names or not units:
              sys.exit('ورقة الأسماء أو الوحدات فاضية')
          json.dump({'names': names, 'units': units}, open('assets/data.json', 'w', encoding='utf-8'),
                    ensure_ascii=False, indent=1)
          print(f'{len(names)} names, {len(units)} units')
          PY

      - name: Add logo asset (shown in the app)
        run: |
          mkdir -p assets
          cp logo_splash.png assets/logo.png
          python3 - <<'PY'
          import re
          p = 'pubspec.yaml'
          s = open(p, encoding='utf-8').read()
          s, n = re.subn(r'(?m)^flutter:[ \t]*$', 'flutter:\n  assets:\n    - assets/logo.png\n    - assets/data.json', s, count=1)
          assert n == 1, 'flutter: section not found in pubspec.yaml'
          open(p, 'w', encoding='utf-8').write(s)
          PY
          sed -n '/^flutter:/,$p' pubspec.yaml

      - name: Move main.dart into lib
        run: mv -f main.dart lib/

      - name: Analyze code (fail fast on errors)
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: App label
        run: sed -i 's/android:label="[^"]*"/android:label="A2R Legacy"/' android/app/src/main/AndroidManifest.xml

      - name: Camera permission
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = (
              '<uses-permission android:name="android.permission.CAMERA"/>\n'
              '    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n'
              '    '
          )
          intent = '<intent><action android:name="android.media.action.IMAGE_CAPTURE"/></intent>\n        '
          if '<queries>' in s:
              s = s.replace('<queries>', '<queries>\n        ' + intent, 1)
          else:
              s = s.replace('<application', '<queries>' + intent + '</queries>\n    <application', 1)
          s = s.replace('<application', perms + '<application', 1)
          # رامات أكبر للتطبيق: ضغط الصور الكبيرة كان بيخلّص الذاكرة ويقفل التطبيق
          s = s.replace('<application', '<application android:largeHeap="true"', 1)
          open(p, 'w', encoding='utf-8').write(s)
          print(s)
          PY

      - name: Volume keys take photos (native MainActivity)
        run: |
          python3 - <<'PY'
          import glob, re, os
          cands = glob.glob('android/app/src/main/**/MainActivity.kt', recursive=True)
          assert cands, 'MainActivity.kt not found'
          p = cands[0]
          pkg = re.search(r'(?m)^package\s+([\w.]+)', open(p, encoding='utf-8').read()).group(1)
          code = """package PKG

          import android.view.KeyEvent
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private var channel: MethodChannel? = null
              private var enabled = false

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  val ch = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "a2r/keys")
                  ch.setMethodCallHandler { call, result ->
                      if (call.method == "enable") {
                          enabled = (call.arguments as? Boolean) ?: false
                          result.success(null)
                      } else {
                          result.notImplemented()
                      }
                  }
                  channel = ch
              }

              override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                  val k = event.keyCode
                  if (enabled && (k == KeyEvent.KEYCODE_VOLUME_UP || k == KeyEvent.KEYCODE_VOLUME_DOWN)) {
                      if (event.action == KeyEvent.ACTION_DOWN && event.repeatCount == 0) {
                          channel?.invokeMethod("vol", null)
                      }
                      return true
                  }
                  return super.dispatchKeyEvent(event)
              }
          }
          """.replace('PKG', pkg)
          open(p, 'w', encoding='utf-8').write(code)
          print(p, pkg)
          PY

      - name: Configure signing (stable secrets optional)
        env:
          A2R_KEYSTORE_BASE64: ${{ secrets.A2R_KEYSTORE_BASE64 }}
          A2R_STORE_PASSWORD: ${{ secrets.A2R_STORE_PASSWORD }}
          A2R_KEY_PASSWORD: ${{ secrets.A2R_KEY_PASSWORD }}
          A2R_KEY_ALIAS: ${{ secrets.A2R_KEY_ALIAS }}
        run: |
          python3 - <<'PYSIGN'
          #!/usr/bin/env python3
          """Use stable signing when configured; otherwise preserve generated debug signing."""
          import base64
          import os
          from pathlib import Path
          import re
          import sys
          
          required = ['A2R_KEYSTORE_BASE64', 'A2R_STORE_PASSWORD', 'A2R_KEY_PASSWORD', 'A2R_KEY_ALIAS']
          # Apply compatibility settings independently of signing mode.
          gradle = Path('android/app/build.gradle.kts')
          source = gradle.read_text()
          source, sdk_count = re.subn(r'(?m)^\s*minSdk\s*=.*$', '        minSdk = 21', source)
          if sdk_count != 1:
              sys.exit('Expected exactly one minSdk field. Refusing ambiguous compatibility settings.')
          source, ndk_count = re.subn(r'(?m)^\s*ndkVersion\s*=.*$', '    ndkVersion = "27.0.12077973"', source)
          if ndk_count != 1:
              sys.exit('Expected exactly one ndkVersion field. Refusing ambiguous build settings.')
          if source.count('signingConfigs.getByName("debug")') != 1:
              sys.exit('Expected exactly one generated debug signing assignment. Refusing an unknown template.')
          gradle.write_text(source)
          
          if not any(os.environ.get(name) for name in required):
              print('::warning::No signing secrets configured. Using generated debug signing. Certificate may change between builds; updates may require uninstall/reinstall after preserving app data.')
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
                  env.write('A2R_SIGNING_MODE=generated-debug\n')
              sys.exit(0)
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              sys.exit('Partial stable-signing configuration. Add all four secrets or remove all four to use debug signing. Missing: ' + ', '.join(missing))
          try:
              data = base64.b64decode(''.join(os.environ['A2R_KEYSTORE_BASE64'].split()), validate=True)
          except Exception:
              sys.exit('A2R_KEYSTORE_BASE64 is not valid base64. No APK will be published.')
          if len(data) < 100:
              sys.exit('Signing keystore is empty or invalid. No APK will be published.')
          key = Path(os.environ['RUNNER_TEMP']) / 'a2r-release-signing.jks'
          key.write_bytes(data)
          key.chmod(0o600)
          gradle = Path('android/app/build.gradle.kts')
          source = gradle.read_text()
          if 'signingConfigs.getByName("debug")' not in source:
              sys.exit('Expected generated signing template not found. Refusing unsafe signing changes.')
          config = '''    signingConfigs {
                  create("a2rRelease") {
                      storeFile = file(System.getenv("A2R_KEYSTORE_PATH") ?: error("Missing release keystore path"))
                      storePassword = System.getenv("A2R_STORE_PASSWORD") ?: error("Missing store password")
                      keyAlias = System.getenv("A2R_KEY_ALIAS") ?: error("Missing key alias")
                      keyPassword = System.getenv("A2R_KEY_PASSWORD") ?: error("Missing key password")
                      enableV1Signing = true
                      enableV2Signing = true
                  }
              }
          
          '''
          if source.count('    buildTypes {') != 1:
              sys.exit('Unexpected Gradle buildTypes template. Refusing to continue.')
          source = source.replace('    buildTypes {', config + '    buildTypes {')
          source = source.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("a2rRelease")')
          # Use the actual supported minimum. Legacy Flutter 3.32.8 supports Android API 21+.
          source, count = re.subn(r'(?m)^\s*minSdk\s*=.*$', '        minSdk = 21', source)
          if count != 1:
              sys.exit('Expected exactly one minSdk field. No build will proceed.')
          if 'signingConfigs.getByName("debug")' in source:
              sys.exit('Debug release signing remains. Refusing to continue.')
          source, ndk_count = re.subn(r'(?m)^\s*ndkVersion\s*=.*$', '    ndkVersion = "27.0.12077973"', source)
          if ndk_count != 1:
              sys.exit('Expected exactly one ndkVersion field. Refusing ambiguous build configuration.')
          gradle.write_text(source)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'A2R_KEYSTORE_PATH={key}\n')
          print('Release signing configured from repository secrets. Android minimum: API 21.')
          
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write('A2R_SIGNING_MODE=stable-release\n')
          PYSIGN

      - name: Separate Legacy application identity
        run: |
          python3 - <<'PYID'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          original = 'applicationId = "com.a2r.a2r"'
          assert s.count(original) == 1, 'Unexpected application ID template'
          p.write_text(s.replace(original, 'applicationId = "com.a2r.a2r.legacy"'))
          PYID

      - name: App icon and splash screen
        run: |
          python3 -m pip install --break-system-packages pillow
          python3 make_icons.py

      - name: Disable R8 minify (ML Kit crashes with NullPointerException when minified)
        run: |
          sed -i -E 's/(signingConfig = signingConfigs.getByName\("[A-Za-z0-9_]+"\))/\1\n            isMinifyEnabled = false\n            isShrinkResources = false/' android/app/build.gradle.kts
          sed -n '/buildTypes/,/^    }/p' android/app/build.gradle.kts

      - name: Skip lint tasks (lint crashes on image_picker)
        run: |
          mkdir -p ~/.gradle
          echo "allprojects { tasks.configureEach { t -> if (t.name.startsWith('lint')) { t.enabled = false } } }" > ~/.gradle/init.gradle
          cat ~/.gradle/init.gradle

      - name: Cache Gradle and NDK
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            /usr/local/lib/android/sdk/ndk
          key: gradle-ndk-v2-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            gradle-ndk-v2-${{ runner.os }}-

      - name: Ensure native build tool and bound runner memory
        run: |
          if ! command -v ninja; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          fi
          python3 - <<'PYMEM'
          from pathlib import Path
          p = Path('android/gradle.properties')
          lines = p.read_text().splitlines()
          assert sum(line.startswith('org.gradle.jvmargs=') for line in lines) == 1
          lines = ['org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8' if line.startswith('org.gradle.jvmargs=') else line for line in lines]
          lines.append('org.gradle.workers.max=2')
          p.write_text('\n'.join(lines) + '\n')
          PYMEM

      - name: Build APK
        env:
          A2R_STORE_PASSWORD: ${{ secrets.A2R_STORE_PASSWORD }}
          A2R_KEY_PASSWORD: ${{ secrets.A2R_KEY_PASSWORD }}
          A2R_KEY_ALIAS: ${{ secrets.A2R_KEY_ALIAS }}
        run: >
          flutter build apk --release
          --target-platform android-arm,android-arm64
          --build-name=1.${{ github.run_number }}-legacy
          --build-number=${{ github.run_number }}
          --dart-define=APP_VERSION=1.${{ github.run_number }}-legacy

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk A2R-Legacy.apk

      - name: Verify signed APK and record compatibility
        run: |
          set -euo pipefail
          echo "APK signing mode: $A2R_SIGNING_MODE"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs A2R-Legacy.apk | tee legacy-signature-report.txt
          APK_ANALYZER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/apkanalyzer' | sort | tail -1)
          test -n "$APK_ANALYZER"
          "$APK_ANALYZER" manifest min-sdk A2R-Legacy.apk | tee legacy-min-sdk.txt
          test "$(tr -d '[:space:]' < legacy-min-sdk.txt)" = 21
          test "$("$APK_ANALYZER" manifest application-id A2R-Legacy.apk)" = com.a2r.a2r.legacy
          "$APK_ANALYZER" manifest version-code A2R-Legacy.apk
          for ABI in armeabi-v7a arm64-v8a; do
            for LIB in libapp.so libflutter.so; do
              unzip -Z1 A2R-Legacy.apk | grep -Fx "lib/$ABI/$LIB"
            done
          done

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/a2r-release-signing.jks"

      - name: Upload Legacy APK and compatibility reports
        uses: actions/upload-artifact@v4
        with:
          name: A2R-Legacy-1.${{ github.run_number }}
          path: |
            A2R-Legacy.apk
            legacy-signature-report.txt
            legacy-min-sdk.txt
          if-no-files-found: error
          retention-days: 30
