name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Generate android platform
        run: flutter create --platforms=android --project-name a2r --org com.a2r .

      - name: Add packages (pinned)
        run: |
          flutter pub add google_mlkit_document_scanner:0.4.1 google_mlkit_text_recognition:^0.15.0 pdf:3.13.1 path_provider:2.1.6 share_plus:10.1.4 shared_preferences:2.5.6 flutter_image_compress:2.5.1 image_picker:1.2.4 permission_handler:11.4.0 open_filex:4.7.0 document_scan:0.5.0 camera:^0.11.0
          flutter pub add flutter_localizations --sdk=flutter

      - name: Add logo asset (shown in the app)
        run: |
          mkdir -p assets
          cp logo_splash.png assets/logo.png
          python3 - <<'PY'
          import re
          p = 'pubspec.yaml'
          s = open(p, encoding='utf-8').read()
          s, n = re.subn(r'(?m)^flutter:[ \t]*$', 'flutter:\n  assets:\n    - assets/logo.png', s, count=1)
          assert n == 1, 'flutter: section not found in pubspec.yaml'
          open(p, 'w', encoding='utf-8').write(s)
          PY
          sed -n '/^flutter:/,$p' pubspec.yaml

      - name: Move main.dart into lib
        run: mv -f main.dart lib/

      - name: Analyze code (fail fast on errors)
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: App label
        run: sed -i 's/android:label="[^"]*"/android:label="A2R"/' android/app/src/main/AndroidManifest.xml

      - name: Camera permission
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = (
              '<uses-permission android:name="android.permission.CAMERA"/>\n'
              '    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n'
              '    '
          )
          intent = '<intent><action android:name="android.media.action.IMAGE_CAPTURE"/></intent>\n        '
          if '<queries>' in s:
              s = s.replace('<queries>', '<queries>\n        ' + intent, 1)
          else:
              s = s.replace('<application', '<queries>' + intent + '</queries>\n    <application', 1)
          s = s.replace('<application', perms + '<application', 1)
          # رامات أكبر للتطبيق: ضغط الصور الكبيرة كان بيخلّص الذاكرة ويقفل التطبيق
          s = s.replace('<application', '<application android:largeHeap="true"', 1)
          open(p, 'w', encoding='utf-8').write(s)
          print(s)
          PY

      - name: Support old Android (minSdk 21)
        run: |
          sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*.*/minSdk = 21/' android/app/build.gradle.kts
          grep -n "minSdk" android/app/build.gradle.kts

      - name: App icon and splash screen
        run: |
          python3 -m pip install --break-system-packages pillow
          python3 make_icons.py

      - name: Disable R8 minify (ML Kit crashes with NullPointerException when minified)
        run: |
          sed -i -E 's/(signingConfig = signingConfigs.getByName\("[a-z]+"\))/\1\n            isMinifyEnabled = false\n            isShrinkResources = false/' android/app/build.gradle.kts
          sed -n '/buildTypes/,/^    }/p' android/app/build.gradle.kts

      - name: Skip lint tasks (lint crashes on image_picker)
        run: |
          mkdir -p ~/.gradle
          echo "allprojects { tasks.configureEach { t -> if (t.name.startsWith('lint')) { t.enabled = false } } }" > ~/.gradle/init.gradle
          cat ~/.gradle/init.gradle

      - name: Cache Gradle and NDK
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            /usr/local/lib/android/sdk/ndk
          key: gradle-ndk-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            gradle-ndk-${{ runner.os }}-

      - name: Build APK
        run: >
          flutter build apk --release
          --target-platform android-arm,android-arm64
          --build-name=1.${{ github.run_number }}
          --build-number=${{ github.run_number }}
          --dart-define=APP_VERSION=1.${{ github.run_number }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk A2R.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: A2R v1.${{ github.run_number }}
          body: "Commit ${{ github.sha }}"
          files: A2R.apk
          fail_on_unmatched_files: true
          make_latest: true

      - name: Keep only the latest 5 releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[5:][].tagName' |
          while read -r tag; do
            echo "Deleting old release $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
