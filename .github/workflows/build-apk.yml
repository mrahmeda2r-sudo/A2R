name: Build APK (Shared)

on:
  push:
    branches: [shared]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Generate android platform
        run: flutter create --platforms=android --project-name a2r --org com.a2r .

      - name: Add packages (pinned)
        run: |
          flutter pub add google_mlkit_document_scanner:0.4.1 google_mlkit_text_recognition:^0.15.0 pdf:3.13.1 path_provider:2.1.6 share_plus:10.1.4 shared_preferences:2.5.6 flutter_image_compress:2.5.1 image_picker:1.2.4 permission_handler:11.4.0 open_filex:4.7.0 camera:^0.11.0
          flutter pub add flutter_localizations --sdk=flutter
          flutter pub add "override:path_provider_android:2.2.23"
          flutter pub add "override:shared_preferences_android:>=2.4.0 <2.5.0"
          echo "--- JNI deps ---"
          flutter pub deps --style=compact | grep -i "jni" || echo "no jni"

      - name: Add logo asset (shown in the app)
        run: |
          mkdir -p assets
          cp logo_splash.png assets/logo.png
          python3 - <<'PY'
          import re
          p = 'pubspec.yaml'
          s = open(p, encoding='utf-8').read()
          s, n = re.subn(r'(?m)^flutter:[ \t]*$', 'flutter:\n  assets:\n    - assets/logo.png', s, count=1)
          assert n == 1, 'flutter: section not found in pubspec.yaml'
          open(p, 'w', encoding='utf-8').write(s)
          PY
          sed -n '/^flutter:/,$p' pubspec.yaml

      - name: Move main.dart into lib
        run: mv -f main.dart lib/

      - name: Analyze code (fail fast on errors)
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: App label
        run: sed -i 's/android:label="[^"]*"/android:label="A2R"/' android/app/src/main/AndroidManifest.xml

      - name: Camera permission
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = (
              '<uses-permission android:name="android.permission.CAMERA"/>\n'
              '    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n'
              '    '
          )
          intent = '<intent><action android:name="android.media.action.IMAGE_CAPTURE"/></intent>\n        '
          if '<queries>' in s:
              s = s.replace('<queries>', '<queries>\n        ' + intent, 1)
          else:
              s = s.replace('<application', '<queries>' + intent + '</queries>\n    <application', 1)
          s = s.replace('<application', perms + '<application', 1)
          s = s.replace('<application', '<application android:largeHeap="true"', 1)
          open(p, 'w', encoding='utf-8').write(s)
          print(s)
          PY

      - name: Camera hardware controls (Volume shutter + Tilt level)
        run: |
          python3 - <<'PY'
          import glob, re, sys

          files = glob.glob('android/app/src/main/**/MainActivity.kt', recursive=True)
          if not files:
              sys.exit('MainActivity.kt not found')
          p = files[0]
          old = open(p, encoding='utf-8').read()
          m = re.search(r'^package\s+([\w.]+)', old, re.M)
          pkg = m.group(1) if m else 'com.a2r.a2r'

          code = f'''package {pkg}

          import android.content.Context
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.view.KeyEvent
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.EventChannel
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {{
              private var hwChannel: MethodChannel? = null
              private var volumeCaptureEnabled = false
              private var sensorManager: SensorManager? = null
              private var tiltListener: SensorEventListener? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {{
                  super.configureFlutterEngine(flutterEngine)
                  hwChannel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "a2r/cam_hw")
                  hwChannel?.setMethodCallHandler {{ call, result ->
                      if (call.method == "setVolumeCapture") {{
                          volumeCaptureEnabled = (call.arguments as? Boolean) ?: false
                          result.success(null)
                      }} else {{
                          result.notImplemented()
                      }}
                  }}

                  EventChannel(flutterEngine.dartExecutor.binaryMessenger, "a2r/tilt")
                      .setStreamHandler(object : EventChannel.StreamHandler {{
                          override fun onListen(arguments: Any?, events: EventChannel.EventSink?) {{
                              stopTilt()
                              val sm = getSystemService(Context.SENSOR_SERVICE) as? SensorManager ?: return
                              val acc = sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER) ?: return
                              sensorManager = sm
                              var lastTs = 0L
                              val listener = object : SensorEventListener {{
                                  override fun onSensorChanged(event: SensorEvent) {{
                                      val now = System.currentTimeMillis()
                                      if (now - lastTs < 50) return
                                      lastTs = now
                                      events?.success(listOf(
                                          event.values[0].toDouble(),
                                          event.values[1].toDouble(),
                                          event.values[2].toDouble()
                                      ))
                                  }}
                                  override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {{}}
                              }}
                              tiltListener = listener
                              sm.registerListener(listener, acc, SensorManager.SENSOR_DELAY_UI)
                          }}

                          override fun onCancel(arguments: Any?) {{
                              stopTilt()
                          }}
                      }})
              }}

              private fun stopTilt() {{
                  tiltListener?.let {{ sensorManager?.unregisterListener(it) }}
                  tiltListener = null
              }}

              override fun onPause() {{
                  stopTilt()
                  super.onPause()
              }}

              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {{
                  if (volumeCaptureEnabled &&
                      (keyCode == KeyEvent.KEYCODE_VOLUME_UP || keyCode == KeyEvent.KEYCODE_VOLUME_DOWN)) {{
                      if (event?.repeatCount == 0) {{
                          hwChannel?.invokeMethod("volumeShot", null)
                      }}
                      return true
                  }}
                  return super.onKeyDown(keyCode, event)
              }}
          }}
          '''
          lines = code.splitlines()
          cleaned = [lines[0]] + [l[10:] if l.startswith('          ') else l for l in lines[1:]]
          open(p, 'w', encoding='utf-8').write('\n'.join(cleaned) + '\n')
          print(f'Updated {p} (package {pkg})')
          PY

      - name: Support old Android (minSdk 21)
        run: |
          sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*.*/minSdk = 21/' android/app/build.gradle.kts
          grep -n "minSdk" android/app/build.gradle.kts

      - name: App icon and splash screen
        run: |
          python3 -m pip install --break-system-packages pillow
          python3 make_icons.py

      - name: Disable R8 minify (ML Kit crashes with NullPointerException when minified)
        run: |
          sed -i -E 's/(signingConfig = signingConfigs.getByName\("[a-z]+"\))/\1\n            isMinifyEnabled = false\n            isShrinkResources = false/' android/app/build.gradle.kts
          sed -n '/buildTypes/,/^    }/p' android/app/build.gradle.kts

      - name: Skip lint tasks (lint crashes on image_picker)
        run: |
          mkdir -p ~/.gradle
          echo "allprojects { tasks.configureEach { t -> if (t.name.startsWith('lint')) { t.enabled = false } } }" > ~/.gradle/init.gradle
          cat ~/.gradle/init.gradle

      - name: Cache Gradle and NDK
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            /usr/local/lib/android/sdk/ndk
          key: gradle-ndk-v2-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            gradle-ndk-v2-${{ runner.os }}-

      - name: Build APK
        run: >
          flutter build apk --release
          --target-platform android-arm,android-arm64
          --build-name=1.${{ github.run_number }}
          --build-number=${{ github.run_number }}
          --dart-define=APP_VERSION=1.${{ github.run_number }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk A2R-Shared.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shared-v1.${{ github.run_number }}
          name: A2R Shared v1.${{ github.run_number }}
          body: "Shared branch commit ${{ github.sha }}"
          files: A2R-Shared.apk
          fail_on_unmatched_files: true
          make_latest: false

      - name: Keep only the latest 5 shared releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("shared-v"))] | sort_by(.createdAt) | reverse | .[5:][].tagName' |
          while read -r tag; do
            echo "Deleting old release $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
