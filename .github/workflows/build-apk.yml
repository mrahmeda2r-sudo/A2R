      - name: Cache Gradle (avoids re-downloading from Maven)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ github.run_number }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Disable Android lintVital tasks (lint crashes with NoSuchMethodError on JDK 17)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/no-lint-vital.gradle <<'EOF'
          allprojects {
            tasks.configureEach { t ->
              if (t.name.startsWith('lintVital')) { t.enabled = false }
            }
          }
          EOF

      - run: flutter pub get
      - name: Build APK (retries on Maven 429 / network errors)
        run: |
          for i in 1 2 3; do
            if flutter build apk --release; then exit 0; fi
            echo "Build attempt $i failed; waiting before retry..."
            sleep $((i * 30))
          done
          exit 1
      - name: Publish release with the APK
        id: rel
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="build-${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk "A2R-Sender-$TAG.apk"
          gh release create "$TAG" "A2R-Sender-$TAG.apk" \
            --target "${{ github.sha }}" \
            --title "A2R Sender #${{ github.run_number }}" \
            --notes "APK build #${{ github.run_number }}"

      - name: Keep only the latest 5 releases
        if: steps.rel.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r t; do
            gh release delete "$t" --cleanup-tag --yes
          done

      - name: Delete old artifacts (free storage quota)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" --jq '.artifacts[].id' |
          while read -r id; do
            gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id" || true
          done

      - name: Upload APK as artifact
        id: art
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: A2R-Sender-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Verify the APK was delivered
        if: steps.rel.outcome != 'success' && steps.art.outcome != 'success'
        run: |
          echo "::error::APK built but neither the Release nor the Artifact upload worked. Check Settings > Actions > General > Workflow permissions (Read and write) and the Artifacts storage quota."
          exit 1
