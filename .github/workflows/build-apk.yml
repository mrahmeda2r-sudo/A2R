name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android platform
        run: flutter create --platforms=android --project-name a2r --org com.a2r .

      - name: Add packages
        run: flutter pub add google_mlkit_document_scanner:^0.4.0 pdf:^3.11.0 path_provider:^2.1.0 share_plus:^10.0.0 shared_preferences:^2.2.0 flutter_image_compress:^2.3.0 image_picker:^1.1.0

      - name: Move main.dart into lib
        run: mv -f main.dart lib/

      - name: App label
        run: sed -i 's/android:label="[^"]*"/android:label="A2R"/' android/app/src/main/AndroidManifest.xml

      - name: Support old Android (minSdk 21)
        run: |
          sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*.*/minSdk = 21/' android/app/build.gradle.kts
          grep -n "minSdk" android/app/build.gradle.kts

      - run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk A2R.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: A2R v1.${{ github.run_number }}
          files: A2R.apk
